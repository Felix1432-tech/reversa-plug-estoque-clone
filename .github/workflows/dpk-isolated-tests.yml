name: DPK isolated tests
on:
  push:
    branches:
      - feature/dpk-integration
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dpk-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connector-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install ".[dev]"
      - name: Run isolated DPK and auth tests
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          ENCRYPTION_KEY: 1X8gJZBvCTfNGzW6BybYH4POqmYRWzAZ18-vfGQqMRM=
          B2_KEY_ID: test
          B2_APPLICATION_KEY: test
        run: python -m pytest -q tests/test_normalizers/test_dpk.py tests/test_api/test_auth.py
